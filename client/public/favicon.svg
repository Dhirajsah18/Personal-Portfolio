<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="accentDot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#brandGrad)" stroke-width="2" stroke-opacity="0.7" />
  
  <!-- Decorative Tech Corner Grid Dot -->
  <circle cx="12" cy="12" r="1.5" fill="#38bdf8" fill-opacity="0.6" />
  
  <!-- Monogram & Terminal Code Style 'D' -->
  <g filter="url(#glow)">
    <!-- Bold 'D' Path -->
    <path d="M 18 16 L 31 16 C 39.5 16 45 22 45 32 C 45 42 39.5 48 31 48 L 18 48 Z M 25 22.5 L 25 41.5 L 30.5 41.5 C 35 41.5 38.5 38 38.5 32 C 38.5 26 35 22.5 30.5 22.5 Z" fill="url(#brandGrad)" />
    
    <!-- Code Accent Slash / Terminal Dot -->
    <circle cx="46" cy="44" r="3.5" fill="url(#accentDot)" />
  </g>
</svg>